name: Code Quality

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Render deterministic reference concepts
        run: npm run render:references
      - name: Check mobile and desktop viewports
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SCREENSHOT_DIR: .reference-screenshots
        run: |
          mkdir -p .reference-screenshots
          npm run check:viewport -- .reference-previews/*.html
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-previews
          path: .reference-screenshots
          if-no-files-found: ignore
